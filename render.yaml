services:
  - type: web
    name: open-webui
    runtime: image
    image:
      url: ghcr.io/open-webui/open-webui:main
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WEBUI_SECRET_KEY
        generateValue: true
      - key: WEBUI_JWT_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_BASE_URL
        value: https://api.deepseek.com/v1
      - key: OPENAI_API_KEY
        sync: false